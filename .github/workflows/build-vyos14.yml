name: Build VyOS 1.4 LTS for eNSP Pro

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ▼▼ 添加下面两行环境变量，强制使用 Node.js 24 ▼▼
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # ▲▲ 以上为新增内容 ▲▲
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: equuleus

      - name: Build ISO and QCOW2
        run: |
          docker run --rm --privileged \
            -v $(pwd):/vyos \
            -w /vyos \
            vyos/vyos-build:equuleus \
            bash -c "sudo make iso && sudo make qcow2"

      - name: Install guestfs tools for image modification
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools

      - name: Patch QCOW2 for eNSP Pro compatibility
        run: |
          QCOW2_FILE=$(ls build/*.qcow2 | head -1)
          if [ -z "$QCOW2_FILE" ]; then
            echo "No QCOW2 file found!"
            exit 1
          fi
          echo "Patching $QCOW2_FILE"

          guestfish --rw -a "$QCOW2_FILE" <<'EOF'
            run
            mount /dev/sda1 /
            sed -i 's/console=ttyS0/console=tty0/g' /boot/grub/grub.cfg
            sed -i '/^GRUB_CMDLINE_LINUX_DEFAULT=/ s/"$/ net.ifnames=0 biosdevname=0"/' /etc/default/grub
            sed -i '/linux / s/$/ net.ifnames=0 biosdevname=0/' /boot/grub/grub.cfg
            exit
          EOF

      - name: Upload patched QCOW2
        uses: actions/upload-artifact@v4
        with:
          name: vyos-1.4-lts-ensp.qcow2
          path: build/*.qcow2

      - name: Upload ISO (optional)
        uses: actions/upload-artifact@v4
        with:
          name: vyos-1.4-lts-iso
          path: build/*.iso
